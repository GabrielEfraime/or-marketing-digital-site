# Verificação automática a cada envio: monta o site e roda os testes (npm run verificar).
# O projeto não tem dependências, então não precisa de npm ci.
name: Verificar o site

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verificar:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - run: npm run verificar
