name: Verificar e publicar o site

# Pull request: só verifica (monta o site e roda os testes). Push no main: verifica e, se passar, publica só a pasta dist/ no GitHub Pages.
# O projeto não tem dependências, então não precisa de npm ci.
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Montar o site
        run: npm run montar
      - name: Verificar
        run: npm run verificar

  publicar:
    needs: verificar
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Montar o site atualizado
        # Cofre do site: as chaves de IA entram CIFRADAS com COFRE_SENHA (nunca em texto). Sem esses segredos, o site sai sem cofre.
        # Configure em Settings > Secrets and variables > Actions: COFRE_SENHA (mínimo 12 caracteres), GROQ_API_KEY e, se quiser, GEMINI_API_KEY e POLLINATIONS_API_KEY.
        env:
          COFRE_SENHA: ${{ secrets.COFRE_SENHA }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
        run: npm run montar
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
